; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; reupload of https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
; but with package.json's "name" field renamed back to framework-arduinoespressif32
platform_packages =
   framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
   
monitor_speed = 115200

[env:nc]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=CTL_NC
  
[env:gpio]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=GP_GPIO

[env:nes]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=GP_NES

[env:snes]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=GP_SNES
  
[env:psx]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=GP_PSX

[env:bluetooth]
build_flags =
  -D DEFAULT_CONTROLLER_TYPE=CTL_BLUETOOTH_CONTROLLER
