name: Build ESP32 Firmware + Deploy Web Flasher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio
        
      - name: Install mklittlefs
        run: |
          curl -sL https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/x86_64-linux-gnu-mklittlefs-42acb97.tar.gz | tar xz
          sudo mv mklittlefs/mklittlefs /usr/local/bin/
          sudo chmod +x /usr/local/bin/mklittlefs

      - name: Build firmware
        run: pio run

      - name: Prepare web flasher site
        run: |
          mkdir -p dist

          # Copy firmware artifacts
          cp .pio/build/*/firmware.bin dist/firmware.bin
          cp .pio/build/*/bootloader.bin dist/bootloader.bin || true
          cp .pio/build/*/partitions.bin dist/partitions.bin || true

          # Copy web flasher page and WebSerialController.html
          cp WebFlash/index.html dist/index.html
          cp WebSerialController.html dist/WebSerialController.html

      - name: Generate ESP Web Tools manifest
        run: |
          CONTROLLERS="no_controller gpio nes snes psx bluetooth"
          CONTROLLER_LIST="$CONTROLLERS"

          for CONTROLLER in $CONTROLLER_LIST; do
            case "$CONTROLLER" in
              no_controller) CONTROLLER_VAL=255 ;;
              gpio) CONTROLLER_VAL=0 ;;
              nes) CONTROLLER_VAL=1 ;;
              snes) CONTROLLER_VAL=2 ;;
              psx) CONTROLLER_VAL=3 ;;
              bluetooth) CONTROLLER_VAL=4 ;;
            esac

            # Write controller type to binary file and create LittleFS image
            CFG_NAME="$CONTROLLER-config.bin"
            mkdir -p tmp/fs_stage
            printf "$(printf '\\%03o' $CONTROLLER_VAL)" \
                > tmp/fs_stage/runtime_config.bin
            mklittlefs -c tmp/fs_stage -s 0x0F000 "dist/$CFG_NAME"

            rm -rf "tmp/fs_stage"

            printf '{\n  "name": "Serial Game Controller Adapter",\n  "version": "1.0.0",\n  "builds": [{\n    "chipFamily": "ESP32",\n    "parts": [\n      { "path": "bootloader.bin", "offset": 4096 },\n      { "path": "partitions.bin", "offset": 32768 },\n      { "path": "firmware.bin",   "offset": 65536 },\n      { "path": "%s",        "offset": 2686976 }\n    ]\n  }]\n}' \
              "$CFG_NAME" \
              > "dist/$CONTROLLER.json"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
